<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Combat Rapide - Naruto vs Sasuke</title>
  <link rel="stylesheet" href="../bootstrap/css/theme.css">
  <link rel="stylesheet" href="combat.css">
</head>
<body>

  <div class="game-container">
    <h1>⚔️ Naruto vs Sasuke ⚡</h1>
    <p id="message">Clique sur "Commencer" pour lancer le combat.</p>

    <div class="btn-container">
      <button id="start-btn">Commencer</button>
      <button id="click-btn" disabled>⚡ Clique dès que tu vois "Rasengan !" ⚡</button>
    </div>

    <p id="result"></p>

    <div class="arena">
      <div class="fighter-container">
        <img src="Minato-Naruto.jpg" alt="Naruto" class="fighter left" height="130px">
        <div class="chakra" id="chakra-left"></div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter-container">
        <img src="Itachi.jpg" alt="Sasuke" class="fighter right" height="130px">
        <img src="Sasuke.jpg" alt="Sasuke" class="fighter right" height="130px">
        <div class="chakra" id="chakra-right"></div>
      </div>
    </div>
  </div>
  
  <div class="Retour p-5">
      <a href="../Page/Accueil.html" class="btn btn-outline-warning"><strong>RETOUR A L'ACCUEIL</strong></a>
    </div>
    

  <!-- Sons -->
  <audio id="rasengan-sound" src="../Video/Kamui.mp3"></audio>
  <audio id="chidori-sound" src="../Video/Faux.mp3"></audio>
  

  <script src="combat.js"></script>
</body>
</html>
